# Infrastructure layer. Services are added here as they are built.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventflow}"]
      interval: 5s
      retries: 10
    networks: [eventflow]

  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [eventflow]

  kafka:  # KRaft mode: no Zookeeper
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [kafkadata:/var/lib/kafka/data]
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12
    networks: [eventflow]

  auth-service:
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: auth-service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/auth_db
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      GRPC_PORT: "50061"
      HTTP_PORT: "3001"
    ports: ["50061:50061", "3001:3001"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks: [eventflow]

  product-service:
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: product-service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/product_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      GRPC_PORT: "50062"
      HTTP_PORT: "3002"
    ports: ["50062:50062", "3002:3002"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, kafka: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks: [eventflow]

  inventory-service:
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: inventory-service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/inventory_db
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      GRPC_PORT: "50051"
      HTTP_PORT: "3003"

    ports: ["3003:3003"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks: [eventflow]

  payment-service:
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: payment-service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/payment_db
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      GRPC_PORT: "50052"
      HTTP_PORT: "3004"
      PAYMENT_FAIL_ABOVE: ${PAYMENT_FAIL_ABOVE:-1000}
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0}
      PAYMENT_PROCESSING_MS: ${PAYMENT_PROCESSING_MS:-1000}
    ports: ["3004:3004"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks: [eventflow]

  order-service:
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: order-service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/order_db
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      GRPC_PORT: "50053"
      HTTP_PORT: "3005"
      PRODUCT_GRPC_URL: product-service:50062
      GRPC_INVENTORY_URL: inventory-service:50051
      GRPC_PAYMENT_URL: payment-service:50052
    ports: ["3005:3005"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy }, product-service: { condition: service_healthy }, inventory-service: { condition: service_healthy }, payment-service: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks: [eventflow]

  cart-service:
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: cart-service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/cart_db
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      GRPC_PORT: "50054"
      HTTP_PORT: "3006"
      KAFKA_BROKERS: kafka:9092
      PRODUCT_GRPC_URL: product-service:50062
    ports: ["3006:3006"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy }, product-service: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks: [eventflow]

  notification-service:
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: notification-service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/notification_db
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      GRPC_PORT: "50055"
      HTTP_PORT: "3007"
      KAFKA_BROKERS: kafka:9092
    ports: ["3007:3007"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks: [eventflow]

  analytics-service:
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: analytics-service } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/analytics_db
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      GRPC_PORT: "50056"
      HTTP_PORT: "3008"
      KAFKA_BROKERS: kafka:9092
    ports: ["3008:3008"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks: [eventflow]

  api-gateway:
    build: { context: ., dockerfile: infrastructure/docker/service.Dockerfile, args: { SERVICE: api-gateway, DIR: apps } }
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      PORT: "4000"
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      AUTH_GRPC_URL: auth-service:50061
      PRODUCT_GRPC_URL: product-service:50062
      CART_GRPC_URL: cart-service:50054
      ORDER_GRPC_URL: order-service:50053
      GRPC_INVENTORY_URL: inventory-service:50051
      NOTIFICATION_GRPC_URL: notification-service:50055
      ANALYTICS_GRPC_URL: analytics-service:50056
    ports: ["4000:4000"]
    depends_on: { redis: { condition: service_healthy }, auth-service: { condition: service_healthy }, product-service: { condition: service_healthy }, cart-service: { condition: service_healthy }, order-service: { condition: service_healthy }, inventory-service: { condition: service_healthy }, notification-service: { condition: service_healthy }, analytics-service: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks: [eventflow]

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: ${PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: { api-gateway: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
      start_period: 20s
    networks: [eventflow]

volumes:
  pgdata:
  redisdata:
  kafkadata:

networks:
  eventflow:
