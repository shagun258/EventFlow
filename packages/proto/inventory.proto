syntax = "proto3";
package inventory;
// Internal RPCs (Check/Reserve/Release) are service-to-service on the private Docker network.
// ListInventory / UpdateInventory require an ADMIN JWT in metadata "authorization".
service InventoryService {
  rpc CheckStock (CheckStockRequest) returns (CheckStockResponse);
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockResponse);
  rpc ListInventory (ListInventoryRequest) returns (ListInventoryResponse);
  rpc UpdateInventory (UpdateInventoryRequest) returns (InventoryItem);
}
message StockItem { string product_id = 1; int32 quantity = 2; }
message CheckStockRequest { repeated StockItem items = 1; }
message CheckStockResponse { bool available = 1; repeated string unavailable_product_ids = 2; }
message ReserveStockRequest { string order_id = 1; repeated StockItem items = 2; }
message ReserveStockResponse { bool success = 1; string message = 2; }
message ReleaseStockRequest { string order_id = 1; }
message ReleaseStockResponse { bool success = 1; }
message InventoryItem { string product_id = 1; int32 quantity = 2; int32 reserved = 3; int32 available = 4; }
message ListInventoryRequest { int32 page = 1; int32 page_size = 2; }
message ListInventoryResponse { repeated InventoryItem items = 1; int32 total = 2; }
message UpdateInventoryRequest { string product_id = 1; int32 quantity = 2; }
