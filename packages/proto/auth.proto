syntax = "proto3";
package auth;
service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser (GetUserRequest) returns (User);
}
message User { string id = 1; string email = 2; string name = 3; string role = 4; string created_at = 5; }
message RegisterRequest { string email = 1; string password = 2; string name = 3; }
message LoginRequest { string email = 1; string password = 2; }
message AuthResponse { string token = 1; User user = 2; }
message ValidateTokenRequest { string token = 1; }
message ValidateTokenResponse { bool valid = 1; string user_id = 2; string email = 3; string role = 4; }
message GetUserRequest { string id = 1; }
